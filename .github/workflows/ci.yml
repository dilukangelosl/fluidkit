name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:cdn
      - run: npm run build:demo
      - name: GPU pixel smoke (headless Chrome + SwiftShader)
        run: node test/gpu-smoke.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
